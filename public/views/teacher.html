<section id="teacherView" class="dashboard" hidden>
  <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>
  <aside id="teacherSidebar" class="sidebar" aria-label="Menú del profesor">
    <div class="sidebar-profile">
      <img
        class="sidebar-logo"
        src="/assets/escudo.png"
        alt="Escudo del colegio"
      />
      <div><strong>Control de asistencia</strong></div>
    </div>
    <nav class="dashboard-nav" aria-label="Secciones del panel">
      <button
        type="button"
        data-panel="codePanel"
        class="nav-button active"
        aria-current="page"
      >
        <span class="nav-symbol" aria-hidden="true"
          ><svg class="icon" aria-hidden="true"><use href="#icon-check" /></svg
        ></span>
        Asistencia
      </button>
      <button type="button" data-panel="studentsPanel" class="nav-button">
        <span class="nav-symbol" aria-hidden="true"
          ><svg class="icon" aria-hidden="true"><use href="#icon-users" /></svg
        ></span>
        Estudiantes
      </button>
    </nav>
    <div class="sidebar-account">
      <strong id="teacherAccountName">Profesor</strong>
      <span id="teacherAccountId" class="account-id"></span>
      <button class="logout-button sidebar-logout" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-logout" /></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="dashboard-content">
    <button
      id="menuButton"
      class="mobile-menu-button"
      type="button"
      aria-label="Abrir menú"
      aria-controls="teacherSidebar"
      aria-expanded="false"
    >
      <svg class="icon" aria-hidden="true"><use href="#icon-menu" /></svg>
      Menú
    </button>
    <!-- PANEL_CODE -->
    <!-- PANEL_STUDENTS -->
  </div>
</section>
