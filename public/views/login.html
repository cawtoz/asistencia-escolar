<section id="loginView" class="login-card panel-card">
  <div class="login-brand">
    <img src="/assets/escudo.png" alt="Escudo del colegio" />
    <div>
      <strong>Plataforma Académica</strong><span>Control de asistencia</span>
    </div>
  </div>
  <div class="page-heading">
    <h1>
      <svg class="icon" aria-hidden="true"><use href="#icon-login" /></svg>
      Iniciar sesión
    </h1>
  </div>
  <form id="loginForm">
    <label for="identifier">Usuario o tarjeta de identidad</label>
    <div class="input-with-icon">
      <svg class="icon" aria-hidden="true"><use href="#icon-id" /></svg>
      <input
        id="identifier"
        name="identifier"
        required
        autocomplete="username"
      />
    </div>
    <label for="password">Contraseña</label>
    <div class="input-with-icon">
      <svg class="icon" aria-hidden="true"><use href="#icon-lock" /></svg>
      <input
        id="password"
        name="password"
        type="password"
        required
        autocomplete="current-password"
      />
    </div>
    <button
      id="loginButton"
      class="button button-primary form-submit"
      type="submit"
    >
      <svg class="icon" aria-hidden="true"><use href="#icon-login" /></svg>
      Entrar
    </button>
  </form>
  <p id="loginMessage" class="message" role="status" hidden></p>
</section>
